[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "braketlab-core"
version = "2.0.0a1"
description = "Browser-native quantum mechanics with Dirac notation algebra"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "anywidget>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["braketlab_core"]
